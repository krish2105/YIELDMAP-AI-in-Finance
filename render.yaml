# Render blueprint for the analytics API.
#
# The warehouse is derived data and is not committed, so the build rebuilds it. That is a feature
# rather than a workaround: the deployed service can only serve figures this repository can
# reproduce, which is the traceability rule enforced by the deployment itself.
services:
  - type: web
    name: yieldmap-api
    runtime: python
    plan: free
    region: singapore
    branch: main
    rootDir: .
    buildCommand: |
      pip install uv
      uv sync --frozen --no-dev
      # --synthetic generates the labelled stand-in when no real drop is present. The provenance
      # stamp follows the drop's own marker, so this cannot publish generated figures as real.
      uv run python -m scripts.build_all --synthetic
    startCommand: uv run uvicorn api.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: "3.12"
      # No provider key is set. The chain falls through to the offline backend and every answer
      # is marked degraded in the interface, which is honest and costs nothing. Adding
      # GEMINI_API_KEY in the Render dashboard is all that is needed to switch the tier on.
      - key: LLM_PROVIDER
        value: fake
      - key: AGENT_MAX_REQUESTS_PER_RUN
        value: "40"
      - key: AGENT_MAX_SECONDS_PER_RUN
        value: "180"
      # Refuse to start unconfigured. The unsafe states are silent ones — an unset AUTH_SECRET
      # invalidates every token on restart, an empty user list makes the write endpoints
      # unreachable — and both look like a healthy service until someone tries to use them.
      - key: YIELDMAP_ENV
        value: production
      # Generated by Render, so the signing key is not in this repository or in anyone's shell
      # history, and rotating it is a dashboard action rather than a commit.
      - key: AUTH_SECRET
        generateValue: true
      # Accounts, as `email:role:argon2-hash`, semicolon separated. Set in the dashboard: the hash
      # is a credential, and scripts/scan_secrets.py blocks one from reaching the repository.
      # Generate with: uv run python -m api.auth hash 'the-password'
      - key: YIELDMAP_USERS
        sync: false
      # Durable memo storage. Unset, the API falls back to a file store on the container's
      # ephemeral disk, which loses every memo on restart — /health reports which is in use.
      - key: DATABASE_URL
        sync: false
      # Error tracking. Unset, Sentry stays off and the service runs normally.
      - key: SENTRY_DSN
        sync: false
