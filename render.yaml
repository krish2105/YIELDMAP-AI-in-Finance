# Render blueprint for the analytics API.
#
# The warehouse is derived data and is not committed, so the build rebuilds it. That is a feature
# rather than a workaround: the deployed service can only serve figures this repository can
# reproduce, which is the traceability rule enforced by the deployment itself.
services:
  - type: web
    name: yieldmap-api
    runtime: python
    plan: free
    region: singapore
    branch: main
    rootDir: .
    buildCommand: |
      pip install uv
      uv sync --frozen --no-dev
      # --synthetic generates the labelled stand-in when no real drop is present. The provenance
      # stamp follows the drop's own marker, so this cannot publish generated figures as real.
      uv run python -m scripts.build_all --synthetic
    startCommand: uv run uvicorn api.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: "3.12"
      # Which backend answers. Naming one starts the chain there and keeps the fallbacks after
      # it, so `gemini` means gemini -> groq -> the offline fixture. That last hop is why this is
      # safe to set whether or not a key exists: with no GEMINI_API_KEY the gemini backend reports
      # itself unavailable, the chain falls through, and every answer is marked degraded in the
      # interface — which is honest and costs nothing.
      #
      # It said `fake` until now, and the comment beside it claimed that adding GEMINI_API_KEY was
      # all that was needed to switch the tier on. That was false: `fake` *pins* the offline
      # backend, deliberately, so that CI cannot reach the network. Adding the key changed
      # nothing, and the only symptom was that nothing changed.
      #
      # CI is unaffected — .github/workflows/ci.yml sets LLM_PROVIDER: fake in its own env block,
      # which is what keeps the suite offline and keyless.
      - key: LLM_PROVIDER
        value: gemini
      # The free tier. Set it in the dashboard and the chain above starts using it; leave it unset
      # and everything still works, degraded and labelled as such.
      #
      # A value already set in the dashboard wins over this file, so an existing service that was
      # created when this said `fake` still says `fake` until someone changes it there. The deploy
      # log is where to check: the `started` line carries llm_chain and llm_answering, so a chain
      # of ["fake"] beside a key that is set names the mistake without reaching the service.
      - key: GEMINI_API_KEY
        sync: false
      - key: AGENT_MAX_REQUESTS_PER_RUN
        value: "40"
      - key: AGENT_MAX_SECONDS_PER_RUN
        value: "180"
      # Refuse to start unconfigured. The unsafe states are silent ones — an unset AUTH_SECRET
      # invalidates every token on restart, an empty user list makes the write endpoints
      # unreachable — and both look like a healthy service until someone tries to use them.
      - key: YIELDMAP_ENV
        value: production
      # Generated by Render, so the signing key is not in this repository or in anyone's shell
      # history, and rotating it is a dashboard action rather than a commit.
      - key: AUTH_SECRET
        generateValue: true
      # Accounts, as `email:role:argon2-hash`, semicolon separated. Set in the dashboard: the hash
      # is a credential, and scripts/scan_secrets.py blocks one from reaching the repository.
      # Generate with: uv run python -m api.auth hash 'the-password'
      - key: YIELDMAP_USERS
        sync: false
      # Durable memo storage. Unset, the API falls back to a file store on the container's
      # ephemeral disk, which loses every memo on restart — /health reports which is in use.
      #
      # This points at a Supabase database shared with another project, which is why the schema
      # below exists: YIELDMAP's tables live in their own namespace and every statement names it,
      # so neither project can reach the other's. Use the **session** pooler (port 5432) or the
      # direct connection; the transaction pooler works too, because the schema is qualified per
      # statement rather than set once per session.
      - key: DATABASE_URL
        sync: false
      # The namespace the memo table lives in. Defaults to `yieldmap` in code, and is set here so
      # the sharing is visible to anyone reading the blueprint rather than being a default they
      # have to go and look up.
      - key: DATABASE_SCHEMA
        value: yieldmap
      # Error tracking. Unset, Sentry stays off and the service runs normally.
      - key: SENTRY_DSN
        sync: false
