[project]
name = "yieldmap"
version = "0.1.0"
description = "Dubai property investment intelligence from open DLD data"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "duckdb>=1.1",
    "polars>=1.9",
    "pyarrow>=17",
    "pandas>=2.2",
    "numpy>=1.26",
    "scikit-learn>=1.5",
    "statsmodels>=0.14",
    "numpy-financial>=1.0",
    "pyyaml>=6.0",
    "httpx>=0.27",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "python-dotenv>=1.0",
    "rank-bm25>=0.2.2",
    "regex>=2026.9.3",
    # Authentication: signed tokens and password hashing. Argon2id is the current recommendation
    # and needs no tuning to be safe by default, unlike bcrypt's cost parameter.
    "pyjwt>=2.9",
    "argon2-cffi>=23.1",
    # Durable storage, when DATABASE_URL is set. Optional at runtime: the API falls back to the
    # file store, which is documented as ephemeral.
    "psycopg[binary,pool]>=3.2",
    # Error tracking, active only when SENTRY_DSN is set.
    "sentry-sdk[fastapi]>=2.17",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "ruff>=0.7",
    "pip-audit>=2.7",
]

# Term 4 artefact generation. Kept out of `dev` and out of the deployed service: the report and
# the deck are produced on demand, not built or served, and the API has no reason to carry a
# document library. `uv sync --extra docs` reproduces them from the lockfile, which is what makes
# regenerating these documents from a fresh clone deterministic.
docs = [
    "python-docx>=1.1",
    "python-pptx>=1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["etl", "finance", "rag", "agents", "api"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C4"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = [
    "network: needs outbound network (skipped in the dev sandbox)",
    "llm: needs a real LLM provider key",
]
filterwarnings = [
    # Deprecations inside Starlette's own test client and anyio are not ours to fix, and they
    # drown the signal when a real warning appears.
    "ignore::DeprecationWarning:starlette.*",
    "ignore::DeprecationWarning:anyio.*",
    "ignore:.*StarletteDeprecationWarning.*",
    "ignore::UserWarning:sklearn.*",
]

[dependency-groups]
dev = [
    "ipykernel>=7.3.0",
    "matplotlib>=3.11.1",
    "nbclient>=0.11.0",
    "nbformat>=5.11.1",
    "playwright>=1.62.0",
]
